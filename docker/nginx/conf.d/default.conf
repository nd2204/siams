server {
    listen 80;
    # server_name vite.yourdomain.com;

    # Cho phép Let's Encrypt xác thực
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # server_name vite.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/vite.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vite.yourdomain.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
